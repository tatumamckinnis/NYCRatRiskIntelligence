# Workspace root — not a package itself.
# Run `uv sync --all-packages` to install all workspace members.

[tool.uv.workspace]
members = ["api", "ml", "evals"]

# ---------------------------------------------------------------------------
# Shared tool configuration (each member also declares these in its own
# pyproject.toml so that per-package overrides are possible).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
# Teaches mypy that pydantic-settings fields are populated by validation
# (env vars / .env), not literal constructor args — without this, every
# BaseSettings subclass with required fields falsely reports missing
# arguments at its no-arg Settings() call site.
plugins = ["pydantic.mypy"]

# Third-party/cross-package boundaries with no py.typed marker — not code
# this workspace owns, so ignore-missing-imports here rather than loosening
# strict mode or scattering # type: ignore across every call site.
[[tool.mypy.overrides]]
module = [
  "asyncpg", "asyncpg.*", "rat_ml.*", "joblib", "shap", "pandas", "pandas.*", "voyageai",
]
ignore_missing_imports = true
