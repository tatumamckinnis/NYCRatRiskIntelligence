name: API — test and deploy

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run linter
        run: uv run ruff check api/

      - name: Run type checker
        run: uv run mypy api/src/

      - name: Run unit tests (no DB required)
        run: uv run pytest api/ -m "not integration" -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (optional)
        # render.yaml has autoDeploy: true, so Render already deploys
        # directly from the git push via its native GitHub integration —
        # independent of this workflow passing or failing. This hook is an
        # optional *additional* trigger (e.g. useful if autoDeploy is ever
        # turned off to gate deploys behind CI); skip cleanly if unset
        # rather than hard-failing the job over an optional step.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping (Render autoDeploy handles this)."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
