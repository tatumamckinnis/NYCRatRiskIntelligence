name: Web — test and deploy

on:
  push:
    branches: [master]
    paths:
      - "web/**"
  pull_request:
    paths:
      - "web/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web exec eslint .

      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}

  # Vercel deploys automatically via its GitHub integration on push to main.
  # This job is a placeholder in case a manual deploy hook is ever needed.
  deploy:
    name: Deploy (Vercel)
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploys automatically via GitHub integration
        run: echo "Vercel deployment triggered by GitHub integration."

  smoke:
    name: Smoke test (production)
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://web-beige-three-56.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Wait for Vercel deployment to go live
        # Vercel's GitHub integration deploys asynchronously — this job has
        # no direct signal for when that finishes, so poll the live URL for
        # a short window rather than testing against a stale deployment.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$PROD_URL"; then
              echo "Site is up."
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for $PROD_URL"
          exit 1

      - name: Playwright smoke test
        run: pnpm --filter web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PROD_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ env.PROD_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: true
